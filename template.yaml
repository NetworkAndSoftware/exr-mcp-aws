AWSTemplateFormatVersion: "2010-09-09"
Transform: AWS::Serverless-2016-10-31
Description: EXR indoor rowing custom-workout MCP server for claude.ai custom connectors; each person signs in with their own EXR account

Parameters:
  SsmPrefix:
    Type: String
    Default: /exr-mcp
    AllowedPattern: ^/[A-Za-z0-9_.-]+(/[A-Za-z0-9_.-]+)*$
    Description: SSM Parameter Store path holding the settings (managed with npm run admin)
  RedirectUris:
    Type: String
    Default: https://claude.ai/api/mcp/auth_callback
    Description: Comma-separated OAuth redirect URIs that clients may register
  ArchiveDays:
    Type: Number
    Default: 5
    MinValue: 1
    Description: Days a workout removed with archive_workouts can be restored, before S3 purges its copy

Resources:
  # Copies of workouts removed from EXR, so removals can be undone
  ArchiveBucket:
    Type: AWS::S3::Bucket
    # Archived workouts outlive the stack; empty and delete the bucket by hand
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      LifecycleConfiguration:
        Rules:
          # The only way archived workouts are purged; the function can't delete them
          - Id: PurgeArchivedWorkouts
            Status: Enabled
            Prefix: archive/
            ExpirationInDays: !Ref ArchiveDays

  McpFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: exr-mcp
      # Built by npm run build:lambda; sam deploy zips this folder as-is (no sam build)
      CodeUri: dist-lambda/
      Handler: index.handler
      Runtime: nodejs22.x
      Architectures: [arm64]
      MemorySize: 1024
      Timeout: 60
      Environment:
        Variables:
          SSM_PREFIX: !Ref SsmPrefix
          OAUTH_REDIRECT_URIS: !Ref RedirectUris
          ARCHIVE_BUCKET: !Ref ArchiveBucket
          ARCHIVE_DAYS: !Ref ArchiveDays
          NODE_ENV: production
          NODE_OPTIONS: --enable-source-maps
      # Public URL; every route except OAuth discovery and the sign-in page requires a token.
      # SAM adds both resource-policy statements (InvokeFunctionUrl and InvokeFunction) for this.
      FunctionUrlConfig:
        AuthType: NONE
      LoggingConfig:
        LogGroup: !Ref McpLogGroup
      Policies:
        - Statement:
            - Effect: Allow
              Action: ssm:GetParameters
              Resource: !Sub arn:${AWS::Partition}:ssm:${AWS::Region}:${AWS::AccountId}:parameter${SsmPrefix}/*
            # Write and read archived workouts, but not delete them
            - Effect: Allow
              Action: [s3:PutObject, s3:GetObject]
              Resource: !Sub ${ArchiveBucket.Arn}/archive/*
            - Effect: Allow
              Action: s3:ListBucket
              Resource: !GetAtt ArchiveBucket.Arn

  McpLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: /aws/lambda/exr-mcp
      RetentionInDays: 14

Outputs:
  McpServerUrl:
    Description: Paste into claude.ai > Settings > Connectors > Add custom connector
    Value: !Sub ${McpFunctionUrl.FunctionUrl}mcp
  ArchiveBucket:
    Description: S3 bucket with the archived (removed) workouts
    Value: !Ref ArchiveBucket
